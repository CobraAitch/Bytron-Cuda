name: Bug report
description: Something crashes, renders wrong, or runs slower than it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line and config
      description: The exact command, plus your JSON config if you use one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console log
      description: Output from startup to the failure.
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: RTX 4070 Ti, driver 581.42
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: CUDA and TensorRT versions
      placeholder: CUDA 13.1, TensorRT 10.15
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 25H2
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Capture backend
      options:
        - wgc
        - dxgi
        - Not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: yolo26m, 640x640, exported with nms=False
