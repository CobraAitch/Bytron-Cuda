<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="arch-t arch-d">
<title id="arch-t">Bytron pipeline architecture</title>
<desc id="arch-d">Frames move from the desktop through a capture backend and a three-entry mailbox into two to four pipeline slots, each running copy, preprocess, TensorRT and readback. Results are postprocessed on the CPU and delivered to an overlay, Vulkan window or callback.</desc>
<rect width="1200" height="500" fill="#0d1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="92" y="56" fill="#9198a1" font-size="15" font-weight="600" text-anchor="middle">Capture thread</text>
<rect x="20" y="96" width="144" height="62" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="92" y="133" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">Desktop</text>
<rect x="20" y="208" width="144" height="76" rx="8" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="92" y="240" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="middle">WGC or DXGI</text>
<text x="92" y="264" fill="#9198a1" font-size="14" font-weight="400" text-anchor="middle">BGRA on GPU</text>
<line x1="92" y1="158" x2="92" y2="198" stroke="#7fbf1a" stroke-width="2"/><path d="M92 207l-6 -11h12z" fill="#7fbf1a"/>
<text x="272" y="56" fill="#9198a1" font-size="15" font-weight="600" text-anchor="middle">Mailbox</text>
<text x="272" y="152" fill="#9198a1" font-size="14" font-weight="400" text-anchor="middle">Stale frames drop</text>
<rect x="208" y="172" width="128" height="42" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="272" y="199" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Newest</text>
<rect x="208" y="222" width="128" height="42" rx="6" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="272" y="249" fill="#9198a1" font-size="16" font-weight="400" text-anchor="middle">Older</text>
<rect x="208" y="272" width="128" height="42" rx="6" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="272" y="299" fill="#9198a1" font-size="16" font-weight="400" text-anchor="middle">Older</text>
<line x1="164" y1="246" x2="198" y2="246" stroke="#7fbf1a" stroke-width="2"/><path d="M207 246l-11 -6v12z" fill="#7fbf1a"/>
<text x="636.0" y="56" fill="#9198a1" font-size="15" font-weight="600" text-anchor="middle">Pipeline slots: 2 to 4 frames in flight</text>
<rect x="384" y="76" width="504" height="340" rx="12" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="402" y="138" fill="#9198a1" font-size="15" font-weight="600" text-anchor="start">Slot 1</text>
<rect x="458" y="98" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="507" y="136" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Copy</text>
<rect x="564" y="98" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="613" y="136" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Preprocess</text>
<rect x="670" y="98" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="719" y="136" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">TensorRT</text>
<rect x="776" y="98" width="98" height="64" rx="6" fill="#12233a" stroke="#5a9ff0" stroke-width="1.5"/>
<text x="825" y="136" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Readback</text>
<text x="402" y="224" fill="#9198a1" font-size="15" font-weight="600" text-anchor="start">Slot 2</text>
<rect x="458" y="184" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="507" y="222" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Copy</text>
<rect x="564" y="184" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="613" y="222" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Preprocess</text>
<rect x="670" y="184" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="719" y="222" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">TensorRT</text>
<rect x="776" y="184" width="98" height="64" rx="6" fill="#12233a" stroke="#5a9ff0" stroke-width="1.5"/>
<text x="825" y="222" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Readback</text>
<text x="402" y="310" fill="#9198a1" font-size="15" font-weight="600" text-anchor="start">Slot 3</text>
<rect x="458" y="270" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="507" y="308" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Copy</text>
<rect x="564" y="270" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="613" y="308" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Preprocess</text>
<rect x="670" y="270" width="98" height="64" rx="6" fill="#1b2710" stroke="#7fbf1a" stroke-width="1.5"/>
<text x="719" y="308" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">TensorRT</text>
<rect x="776" y="270" width="98" height="64" rx="6" fill="#12233a" stroke="#5a9ff0" stroke-width="1.5"/>
<text x="825" y="308" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Readback</text>
<text x="636.0" y="390" fill="#9198a1" font-size="14" font-weight="400" text-anchor="middle">Each slot has its own CUDA stream and TensorRT context</text>
<line x1="336" y1="246" x2="374" y2="246" stroke="#7fbf1a" stroke-width="2"/><path d="M383 246l-11 -6v12z" fill="#7fbf1a"/>
<text x="977" y="56" fill="#9198a1" font-size="15" font-weight="600" text-anchor="middle">Inference thread</text>
<rect x="914" y="200" width="126" height="92" rx="8" fill="#12233a" stroke="#5a9ff0" stroke-width="1.5"/>
<text x="977" y="238" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Postprocess</text>
<text x="977" y="262" fill="#9198a1" font-size="14" font-weight="400" text-anchor="middle">Filter, rescale</text>
<line x1="888" y1="246" x2="904" y2="246" stroke="#5a9ff0" stroke-width="2"/><path d="M913 246l-11 -6v12z" fill="#5a9ff0"/>
<text x="1120" y="56" fill="#9198a1" font-size="15" font-weight="600" text-anchor="middle">Output</text>
<rect x="1062" y="128" width="118" height="64" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="1121" y="166" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Overlay</text>
<rect x="1062" y="214" width="118" height="64" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="1121" y="252" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Vulkan</text>
<rect x="1062" y="300" width="118" height="64" rx="8" fill="#151b23" stroke="#30363d" stroke-width="1.5"/>
<text x="1121" y="338" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Callback</text>
<line x1="1040" y1="246" x2="1052" y2="246" stroke="#5a9ff0" stroke-width="2"/><path d="M1061 246l-11 -6v12z" fill="#5a9ff0"/>
<rect x="384" y="449" width="16" height="16" rx="3" fill="#1b2710" stroke="#7fbf1a"/>
<text x="408" y="462" fill="#9198a1" font-size="15" font-weight="400" text-anchor="start">GPU memory: frames stay here</text>
<rect x="660" y="449" width="16" height="16" rx="3" fill="#12233a" stroke="#5a9ff0"/>
<text x="684" y="462" fill="#9198a1" font-size="15" font-weight="400" text-anchor="start">Host memory: detection results only</text>
</g>
</svg>
